<svg xmlns="http://www.w3.org/2000/svg" width="860" height="540" viewBox="0 0 860 540" role="img" aria-label="Illustrative mockup of the dashboard UI">
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1220"/>
      <stop offset="1" stop-color="#0a1424"/>
    </linearGradient>
    <linearGradient id="bar" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0" stop-color="#1f3a63"/>
      <stop offset="1" stop-color="#4d9fff"/>
    </linearGradient>
    <linearGradient id="meter" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#34d399"/>
      <stop offset="0.5" stop-color="#f5b841"/>
      <stop offset="1" stop-color="#f87171"/>
    </linearGradient>
  </defs>

  <rect width="860" height="540" fill="url(#g)"/>

  <!-- sidebar -->
  <rect x="0" y="0" width="190" height="540" fill="#0d1a2f"/>
  <text x="24" y="46" fill="#f5b841" font-family="'Big Shoulders Display', 'Segoe UI', sans-serif" font-size="26" font-weight="800" letter-spacing="1">NEXTBELL</text>
  <text x="24" y="66" fill="#5b7ba6" font-family="Segoe UI, sans-serif" font-size="11">Stock Sentiment</text>
  <g font-family="Segoe UI, sans-serif" font-size="13" fill="#8fa0bd">
    <rect x="14" y="96" width="162" height="34" rx="8" fill="#16294a"/>
    <text x="30" y="118" fill="#e6edf7">Dashboard</text>
    <text x="30" y="152">Stocks</text>
    <text x="30" y="184">Intelligence</text>
    <text x="30" y="216">AI Insights</text>
    <text x="30" y="248">System</text>
    <text x="30" y="280">Jobs</text>
    <text x="30" y="312">Models</text>
  </g>
  <text x="30" y="516" fill="#5b7ba6" font-family="Consolas, monospace" font-size="10">data_mode: demo</text>

  <!-- header -->
  <rect x="190" y="0" width="670" height="58" fill="#0d1a2f"/>
  <text x="214" y="37" fill="#e6edf7" font-family="'Instrument Sans','Segoe UI',sans-serif" font-size="18" font-weight="600">Dashboard</text>
  <rect x="700" y="16" width="146" height="26" rx="13" fill="#16294a"/>
  <text x="773" y="34" fill="#34d399" font-family="Consolas, monospace" font-size="11" text-anchor="middle">● healthy</text>

  <!-- metric cards -->
  <g font-family="Segoe UI, sans-serif">
    <rect x="214" y="82" width="150" height="80" rx="10" fill="#111f38"/>
    <text x="228" y="106" fill="#8fa0bd" font-size="11">Assets tracked</text>
    <text x="228" y="140" fill="#e6edf7" font-size="28" font-weight="700">10</text>
    <rect x="378" y="82" width="150" height="80" rx="10" fill="#111f38"/>
    <text x="392" y="106" fill="#8fa0bd" font-size="11">Jobs queued</text>
    <text x="392" y="140" fill="#4d9fff" font-size="28" font-weight="700">3</text>
    <rect x="542" y="82" width="150" height="80" rx="10" fill="#111f38"/>
    <text x="556" y="106" fill="#8fa0bd" font-size="11">Model version</text>
    <text x="556" y="138" fill="#e6edf7" font-size="15" font-weight="700">hf-lr-2026-11-10</text>
    <rect x="706" y="82" width="140" height="80" rx="10" fill="#111f38"/>
    <text x="720" y="106" fill="#8fa0bd" font-size="11">Dir. accuracy</text>
    <text x="720" y="140" fill="#f5b841" font-size="24" font-weight="700">—</text>
    <text x="720" y="156" fill="#5b7ba6" font-size="9">no overlap</text>
  </g>

  <!-- sentiment meter (three zones) -->
  <rect x="214" y="186" width="632" height="120" rx="12" fill="#0f1c33"/>
  <text x="234" y="212" fill="#e6edf7" font-family="Segoe UI, sans-serif" font-size="13" font-weight="600">Combined sentiment · 10-day window</text>
  <rect x="234" y="232" width="592" height="14" rx="7" fill="url(#meter)" opacity="0.85"/>
  <rect x="520" y="224" width="6" height="30" rx="3" fill="#e6edf7"/>
  <g font-family="Consolas, monospace" font-size="10" fill="#8fa0bd">
    <text x="234" y="270">negative</text>
    <text x="522" y="270" text-anchor="middle">0</text>
    <text x="826" y="270" text-anchor="end">positive</text>
  </g>

  <!-- price chart -->
  <rect x="214" y="322" width="384" height="186" rx="12" fill="#0f1c33"/>
  <text x="234" y="348" fill="#e6edf7" font-family="Segoe UI, sans-serif" font-size="13" font-weight="600">Price · DEMO-HK-001</text>
  <g stroke="#1f3a63" stroke-width="1">
    <line x1="234" y1="470" x2="578" y2="470"/>
    <line x1="234" y1="430" x2="578" y2="430"/>
    <line x1="234" y1="390" x2="578" y2="390"/>
  </g>
  <g>
    <rect x="244" y="452" width="18" height="18" fill="url(#bar)"/>
    <rect x="268" y="440" width="18" height="30" fill="url(#bar)"/>
    <rect x="292" y="446" width="18" height="24" fill="url(#bar)"/>
    <rect x="316" y="426" width="18" height="44" fill="url(#bar)"/>
    <rect x="340" y="414" width="18" height="56" fill="url(#bar)"/>
    <rect x="364" y="432" width="18" height="38" fill="url(#bar)"/>
    <rect x="388" y="406" width="18" height="64" fill="url(#bar)"/>
    <rect x="412" y="398" width="18" height="72" fill="url(#bar)"/>
    <rect x="436" y="410" width="18" height="60" fill="url(#bar)"/>
    <rect x="460" y="388" width="18" height="82" fill="url(#bar)"/>
    <rect x="484" y="376" width="18" height="94" fill="url(#bar)"/>
    <rect x="508" y="384" width="18" height="86" fill="url(#bar)"/>
  </g>

  <!-- raw json panel -->
  <rect x="614" y="322" width="232" height="186" rx="12" fill="#0a1120"/>
  <text x="630" y="346" fill="#8fa0bd" font-family="Consolas, monospace" font-size="11">response · /api/assets</text>
  <g font-family="Consolas, monospace" font-size="11" fill="#7fd8a8">
    <text x="630" y="372">{"status":"ok",</text>
    <text x="630" y="390"> "count":10,</text>
    <text x="630" y="408"> "data_mode":"demo"</text>
    <text x="630" y="426"> "as_of":"..."}</text>
  </g>
  <text x="630" y="490" fill="#5b7ba6" font-family="Consolas, monospace" font-size="9">demo · as_of = UTC now</text>

  <!-- illustration label -->
  <rect x="214" y="512" width="220" height="20" rx="6" fill="none"/>
  <text x="214" y="527" fill="#5b7ba6" font-family="Consolas, monospace" font-size="10">▸ Illustrative mockup — drop real captures in img/screenshots/</text>
</svg>
