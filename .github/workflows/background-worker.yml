# Background worker via GitHub Actions (Phase 5).
#
# Design (source-verified, see GITHUB_ACTIONS_AUDIT_REPORT.md):
# - Schedule: every 6 hours, UTC (00:00 / 06:00 / 12:00 / 18:00). GitHub
#   Actions cron is always UTC.
# - Each run DRAINS the eligible job queue: it repeats
#   `python -m app.workers.main --once` (bounded, max 50 iterations) until the
#   worker logs "no jobs available". --once processes one job per invocation
#   and exits cleanly, so this creates no long-lived process.
#   - With 10 confirmed assets the scheduler creates 40 jobs/day
#     (4 job types x 10 assets, deduped per date via ON CONFLICT DO NOTHING).
#     One drain run clears the whole day's queue; later runs are cheap no-ops.
#   - score:sentiment jobs are created with run_after = +30 min, so they are
#     claimed on the next scheduled run (noted in the guide).
# - Job-level failures never fail this step: the worker requeues with
#   exponential backoff or marks the job permanently failed, and --once still
#   exits 0. Only a fatal worker error (e.g. persistent DB outage) makes the
#   step fail: the worker spins on the claim error and the job
#   timeout-minutes below kills the run, surfacing it as a red run.
# - Concurrency group prevents overlapping runs (queued runs wait).
# - HF model cache: the app reads HF_CACHE_DIR (backend/app/core/config.py:73)
#   and the analyzer overwrites HF_HOME with that value
#   (backend/app/sentiment/analyzer.py:51). The only verified model is
#   cardiffnlp/twitter-roberta-base-sentiment-latest (~490 MB, CPU).
#   actions/cache persists the directory between runs (free; 5 GB repo cap).
# - CPU-only torch is installed up front so `pip install -e .` does not pull
#   the multi-GB CUDA wheels on the runner.
name: Background Worker

on:
  schedule:
    - cron: '0 */6 * * *'   # 00:00, 06:00, 12:00, 18:00 UTC
  workflow_dispatch: {}

concurrency:
  group: background-worker
  cancel-in-progress: false

jobs:
  process-jobs:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'   # matches backend/Dockerfile pin
          cache: 'pip'            # caches wheel downloads across runs

      - name: Install CPU-only torch (avoid multi-GB CUDA wheels on runner)
        run: pip install 'torch>=2.0,<3' --index-url https://download.pytorch.org/whl/cpu

      - name: Install backend dependencies
        working-directory: backend
        run: |
          pip install --upgrade pip
          pip install -e .

      - name: Verify database connectivity (gate before processing)
        working-directory: backend
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: >
          python -c "from app.database.engine import get_shared_engine; from sqlalchemy import text;
          conn = get_shared_engine().connect(); conn.execute(text('SELECT 1')); conn.close();
          print('Database connectivity: OK')"

      - name: Restore Hugging Face model cache
        uses: actions/cache@v4
        with:
          path: /tmp/hf_models
          # Bump vN when VERIFIED_MODELS in app/sentiment/language.py changes.
          key: hf-roberta-v1

      - name: Drain job queue (bounded --once loop)
        working-directory: backend
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          DATA_MODE: live
          MARKET_DATA_PROVIDER: twelve_data
          TWELVE_DATA_API_KEY: ${{ secrets.TWELVE_DATA_API_KEY }}
          EXA_API_KEY: ${{ secrets.EXA_API_KEY }}
          TAVILY_API_KEY: ${{ secrets.TAVILY_API_KEY }}
          APIFY_API_TOKEN: ${{ secrets.APIFY_API_TOKEN }}
          HF_CACHE_DIR: /tmp/hf_models
        run: |
          for i in $(seq 1 50); do
            echo "=== worker iteration $i ==="
            if OUT=$(python -m app.workers.main --once 2>&1); then :; else
              echo "$OUT"
              echo "::error::worker exited non-zero on iteration $i"
              exit 1
            fi
            echo "$OUT"
            if echo "$OUT" | grep -Eq "no jobs available|no confirmed assets found, nothing to schedule"; then
              echo "Queue drained (no eligible jobs) at iteration $i"
              break
            fi
          done
          echo "Drain loop finished"

      - name: Job queue status summary
        if: always()
        working-directory: backend
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          python - <<'EOF'
          import json
          from sqlalchemy import select, func
          from app.database.session import get_session_factory
          from app.database.models import CollectionJob

          with get_session_factory()() as s:
              rows = s.execute(
                  select(CollectionJob.status, func.count())
                  .group_by(CollectionJob.status)
              ).all()

          print("## Job queue status")
          print()
          print("| Status | Count |")
          print("| --- | --- |")
          for status, count in rows:
              print(f"| {status} | {count} |")
          EOF

      - name: Report execution summary
        if: always()
        run: |
          echo "### Worker Execution Summary" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "- **Status**: ${{ job.status }}" >> "$GITHUB_STEP_SUMMARY"
          echo "- **Triggered by**: ${{ github.event_name }}" >> "$GITHUB_STEP_SUMMARY"
          echo "- **Branch**: ${{ github.ref_name }}" >> "$GITHUB_STEP_SUMMARY"
