<svg width="48" height="48" viewBox="0 0 48 48" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Background circle with HENGSENG gradient -->
  <defs>
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="accentGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#f59e0b"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="2" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background circle -->
  <circle cx="24" cy="24" r="22" fill="url(#bgGradient)" stroke="#334155" stroke-width="1"/>

  <!-- Abstract bell icon -->
  <path d="M16 16C16 13.7909 17.7909 12 20 12H28C30.2091 12 32 13.7909 32 16V26C32 28.2091 30.2091 30 28 30H20C17.7909 30 16 28.2091 16 26V16Z" fill="url(#accentGradient)" filter="url(#glow)"/>

  <!-- Bell chord line -->
  <path d="M24 30V34M22 34H26" stroke="#3b82f6" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Data pulse dots -->
  <circle cx="14" cy="20" r="1.5" fill="#f59e0b" opacity="0.8"/>
  <circle cx="20" cy="18" r="1.5" fill="#f59e0b" opacity="0.6"/>
  <circle cx="26" cy="19" r="1.5" fill="#f59e0b" opacity="0.4"/>

  <!-- Hengseng text mark -->
  <text x="24" y="41" text-anchor="middle" font-family="Inter, sans-serif" font-size="6" font-weight="700" fill="#94a3b8" letter-spacing="2">HS</text>
</svg>
