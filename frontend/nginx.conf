# Frontend Nginx: static React build + /api/ reverse proxy to the backend
# service. Browsers only ever see same-origin relative paths (/api/...);
# internal service names are never exposed to client code.

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Docker's embedded DNS so backend recreation never strands a stale IP.
    resolver 127.0.0.11 valid=30s ipv6=off;

    # Hashed build assets: cache aggressively.
    location /assets/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # API reverse proxy (URI passed through unchanged: /api/health -> /api/health).
    location /api/ {
        set $upstream_backend http://backend:8000;
        proxy_pass $upstream_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    # SPA fallback: client routes must survive hard refresh.
    # NOTE: we intentionally omit the "$uri/" directory term — the Vite bundle
    # lives in dist/assets/, which would otherwise shadow the /assets client
    # route (slash-less /assets would 301 to the static dir instead of index.html).
    # Real hashed files are still served by the more-specific "location /assets/".
    location / {
        add_header Cache-Control "no-cache";
        try_files $uri /index.html;
    }

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
}
